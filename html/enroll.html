<!DOCTYPE html> 
<html>

  <head>
     <title>PAWSITIVE PET ACADEMY</title>

<style>


nav {
   gridcolumn: 2;
   justify-self: center;
   color: black;
}

body {
            background-color: #fbf3e4;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

     
        .enroll-container {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        
        .enroll-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .enroll-header h2 {
            color: #102a56;
            font-size: 2rem;
            margin-bottom: 5px;
        }

        .enroll-header p {
            color: #555;
            font-size: 1rem;
            margin: 0;
        }

       
        .enroll-form-box {
            background: #ffffff;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            border: 1px solid #e2e8f0;
        }

        .enroll-form-box h3 {
            color: #102a56;
            margin-top: 0;
            margin-bottom: 20px;
            font-size: 1.3rem;
            border-bottom: 2px solid #f1f5f9;
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-group.half {
            flex: 1;
        }

        .form-group label {
            display: block;
            color: #102a56;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 8px;
        }

        .form-group input, 
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            font-size: 0.95rem;
            box-sizing: border-box;
        }

        .form-group textarea {
            resize: vertical;
            height: 100px;
        }

        
        .course-checkbox-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 6px;
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
        }

        .course-checkbox-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.95krem;
            color: #333;
        }

        .course-checkbox-item input {
            width: 18px;
            height: 18px;
            accent-color: #102a56;
            cursor: pointer;
        }

        /* Submit Button Style */
        .submit-btn {
            background-color: #102a56;
                color: #d4af37;
            border: none;
            padding: 14px 25px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1.05rem;
            width: 100%;
            transition: opacity 0.2s;
        }

        .submit-btn:hover {
            opacity: 0.9;
        }


</style>



  </head>

 <body>

<nav style="margin: 0 auto;">
    <a href="index.html" style="margin: 0 15px; text-decoration: none; color: black; font-weight: 500;">Home</a>
    <a href="about us.html" style="margin: 0 15px; text-decoration: none; color: black; font-weight: 500;">About Us</a>
    <a href="contact.html" style="margin: 0 15px; text-decoration: none; color: black; font-weight: 500;">Contact</a>
    <a href="fees.html" style="margin: 0 15px; text-decoration: none; color: black; font-weight: 500;">Fees</a>

</nav>


<div class="enroll-container">
        
   <div class="enroll-header">
            <h2>Pawsitive Pet Academy Enrollment Form</h2>
            <p>Fill out the form below to enroll your dog in our professional training programs.</p>
   </div>

       
 <div class="enroll-form-box">
      <h3>Student & Owner Registration</h3>
            
            <form action="#" method="POST">
                
                
 <div class="form-row">
     <div class="form-group half">
     <label for="owner-name">Owner's Full Name</label>
      <input type="text" id="owner-name" name="owner-name" placeholder="e.g. Jane Doe" required>
  </div>

<div class="form-group half">
   <label for="phone">Phone Number</label>
   <input type="tel" id="phone" name="phone" placeholder="e.g. +27 63 448 9250" required>
  </div>
</div>

                
<div class="form-group">
   <label for="email">Email Address</label>
   <input type="email" id="email" name="email" placeholder="you@example.com" required>
</div>

               
                
<div class="form-row">
   <div class="form-group half">
   <label for="dog-name">Dog's Name</label>
   <input type="text" id="dog-name" name="dog-name" placeholder="e.g. Max" required>
 </div>
                    
<div class="form-group half">
   <label for="dog-age">Dog's Age / Breed</label>
   <input type="text" id="dog-age" name="dog-age" placeholder="e.g. 5 months, Golden Retriever" required>
  </div>
</div>

               
<div class="form-group">
   <label>Select Course(s) You Wish to Enroll In:</label>
   <div class="course-checkbox-group">
   <label class="course-checkbox-item">
   <input type="checkbox" name="courses" value="puppy-preschool"> Puppy Preschool (R750)
 </label>

                        
<label class="course-checkbox-item">
   <input type="checkbox" name="courses" value="obedience"> Canine Obedience (R1500)
</label>
                        

<label class="course-checkbox-item">
   <input type="checkbox" name="courses" value="grooming"> Pet Grooming (R1500)
</label>
                        

<label class="course-checkbox-item">
   <input type="checkbox" name="courses" value="agility"> Agility Course (R1500)
</label>
                        

<label class="course-checkbox-item">
   <input type="checkbox" name="courses" value="behaviour"> Animal Behaviour (R1500)
</label>
                        

<label class="course-checkbox-item">
   <input type="checkbox" name="courses" value="private"> Private Consultation (R750)
  </label>
 </div>
</div>

                
<div class="form-group">
   <label for="comments">Additional Notes / Behavioural Concerns</label>
   <textarea id="comments" name="comments" placeholder="Tell us anything else we should know about your dog..."></textarea>
</div>

                
<button type="submit" class="submit-btn">Complete Enrollment</button>
  </form>
</div>

 </div>

 </body>

</html>
